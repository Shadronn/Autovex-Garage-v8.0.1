{% extends "base.html" %}

{% block sidebar %}

{% endblock %}
{% block content %}


<form method="POST" class="form-card">
    <h4>Edit Customer</h4>
    <p>Customer details</p>

    <div class="form-group">
        <input name="customer_name" value="{{customer.customer_name}}" required>
    </div>
    <div class="form-group">
        <input name="telno" value="{{customer.telno}}" required>
    </div>
    <div class="form-group">
        <input name="email" value="{{customer.email}}">
    </div>
    <div class="form-group">
        <select name="customer_class" id="">
            <option value="Individual" {{"selected" if customer.customer_class == "Individual" }}>Individual</option>
            <option value="Corporate" {{"selected" if customer.customer_class =="Corporate" }}>Corporate</option>
          <option value="Insurance" {{"selected" if customer.customer_class == "Insurance" }}>Insurance  </option>
        </select>
    </div>
    <div class="form-group">
        <input name="address" value="{{ customer.address}}">
    </div>
   <div class="button-group">
                <button type="submit" class="login-btn">Save Changes</button>
                
                <a href="{{ url_for('customers') }}" class="table-filter-btn">Cancel</a>
                
            </div>
    
</form>


{% endblock %}
