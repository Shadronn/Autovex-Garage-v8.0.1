{% extends "base.html" %}

{% block content %}

<div class="page-header">

    <div>

        <h4>Record Supplier Invoice</h4>

        <p>
            Record an invoice received from a supplier.
        </p>

    </div>

</div>


<form
    method="POST"
    class="form-card"
>


    <!-- ========================================= -->
    <!-- SUPPLIER INFORMATION -->
    <!-- ========================================= -->

    <div class="section-header">

        <h4>Supplier Information</h4>

    </div>


    <div class="form-grid">


        <div class="form-group">

            <label for="supplier_id">
                Supplier
            </label>

            <select
                id="supplier_id"
                name="supplier_id"
                required
            >

                <option value="">
                    Select supplier
                </option>

                {% for supplier in suppliers %}

                    <option
                        value="{{ supplier.id }}"
                    >
                        {{ supplier.supplier_name }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label for="bill_number">
                Supplier Invoice Number
            </label>

            <input
                type="text"
                id="bill_number"
                name="bill_number"
                required
                placeholder="e.g. INV-4582"
            >

        </div>


        <div class="form-group">

            <label for="bill_date">
                Invoice Date
            </label>

            <input
                type="date"
                id="bill_date"
                name="bill_date"
                value="{{ request.form.get('bill_date', '') }}"
            >

        </div>


        <div class="form-group">

            <label for="due_date">
                Due Date
            </label>

            <input
                type="date"
                id="due_date"
                name="due_date"
            >

        </div>


        <div class="form-group full-width">

            <label for="description">
                Description
            </label>

            <input
                type="text"
                id="description"
                name="description"
                placeholder="e.g. Spare parts supplied"
            >

        </div>


    </div>


    <!-- ========================================= -->
    <!-- FINANCIAL INFORMATION -->
    <!-- ========================================= -->

    <div class="section-header">

        <h4>Invoice Amount</h4>

    </div>


    <div class="form-grid">


        <div class="form-group">

            <label for="amount">
                Invoice Total (KES)
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                min="0.01"
                step="0.01"
                required
                placeholder="0.00"
            >

        </div>


    </div>


    <!-- ========================================= -->
    <!-- NOTES -->
    <!-- ========================================= -->

    <div class="section-header">

        <h4>Notes</h4>

    </div>


    <div class="form-grid">

        <div class="form-group full-width">

            <label for="notes">
                Notes
            </label>

            <textarea
                id="notes"
                name="notes"
                rows="4"
                placeholder="Additional information about this supplier invoice..."
            ></textarea>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- INFORMATION -->
    <!-- ========================================= -->

    <div class="job-card-summary">

        <div class="job-card-summary-row">

            <span>Invoice Amount</span>

            <strong>
                KES
                <span id="invoicePreview">
                    0.00
                </span>
            </strong>

        </div>


        <div class="job-card-summary-row">

            <span>Amount Paid</span>

            <strong>
                KES 0.00
            </strong>

        </div>


        <div class="job-card-summary-row grand-total">

            <span>Outstanding Balance</span>

            <strong>
                KES
                <span id="balancePreview">
                    0.00
                </span>
            </strong>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- ACTIONS -->
    <!-- ========================================= -->

    <div class="button-group">

        <button
            type="submit"
            class="login-btn"
        >

            <i class="bx bx-save"></i>

            Record Supplier Invoice

        </button>


        <a
            href="{{ url_for('procurement') }}"
            class="cancel-btn"
        >

            Cancel

        </a>

    </div>


</form>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const amountInput =
            document.getElementById("amount");

        const invoicePreview =
            document.getElementById("invoicePreview");

        const balancePreview =
            document.getElementById("balancePreview");


        amountInput.addEventListener(
            "input",
            function () {

                const amount =
                    parseFloat(
                        amountInput.value
                    ) || 0;


                invoicePreview.textContent =
                    amount.toFixed(2);


                balancePreview.textContent =
                    amount.toFixed(2);

            }
        );

    }
);

</script>

{% endblock %}
