{% extends "base.html" %}
{% block sidebar %}

{% endblock %}

{% block content %}

<div class="form-container">

    <form method="POST" class="form-card">

        <h1>Edit Vehicle</h1>
        <p>Update vehicle information</p>

        <div class="form-group">
            <label>Registration Number</label>
            <input
                type="text"
                name="registration_no"
                value="{{ vehicle.registration_no }}"
                required>
        </div>

        <div class="form-group">
            <label>Vehicle Model</label>
            <input
                type="text"
                name="model"
                value="{{ vehicle.model }}"
                required>
        </div>

        <div class="form-group">
            <label>Vehicle Color</label>
            <input
                type="text"
                name="color"
                value="{{ vehicle.color }}"
                required>
        </div>

        <div class="form-group">
            <label>Year of Manufacture</label>
            <input
                type="number"
                name="yom"
                min="1900"
                max="2100"
                value="{{ vehicle.yom }}"
                required>
        </div>

        <div class="button-group">

            <button type="submit" class="login-btn">
                <i class='bx bx-save'></i>
                Update Vehicle
            </button>

            <a href="{{ url_for('vehicle_details', vehicle_id=vehicle.id) }}"
               class="cancel-btn">
                <i class='bx bx-x'></i>
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
